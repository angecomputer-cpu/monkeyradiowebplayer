<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f7ca18; /* Il Giallo Monkey per test, toglilo se lo integri in Nicepage */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            user-select: none;
        }

        /* Contenitore principale del blocco Player */
        .player-wrapper {
            position: relative;
            width: 90%;
            max-width: 600px;
            height: 70px; /* Altezza della barra bianca */
            margin-left: 50px; /* Spazio per far sporgere la copertina a sx */
            margin-top: 100px; /* Spazio in alto per far sbucare la copertina */
        }

        /* =======================================
           LA MAGIA DELLA COPERTINA
           ======================================= */
        .cover-stage {
            position: absolute;
            left: -40px;     /* Sporge a sinistra */
            bottom: 10px;    /* Scende un po' dietro la barra bianca */
            width: 140px;    /* 3 volte più grande di prima */
            height: 140px;
            z-index: 1;      /* STA DIETRO LA BARRA BIANCA */
            border-radius: 12px;
            /* L'ombra a sinistra dà la profondità come hai chiesto */
            box-shadow: -8px 12px 25px rgba(0,0,0,0.3);
            /* IL SEGRETO: Nasconde tutto ciò che esce dal quadrato (es. animazione verso il basso) */
            overflow: hidden; 
            background-color: #000;
        }

        .cover-art {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 12px;
            /* L'EFFETTO MOLLA (Bouncy) */
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Classi per l'animazione di entrata/uscita */
        .cover-hidden { transform: translateY(110%); } /* Nascosta in basso */
        .cover-visible { transform: translateY(0); }   /* Visibile al suo posto */

        /* =======================================
           LA BARRA BIANCA
           ======================================= */
        .player-bar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffffff;
            border-radius: 12px;
            z-index: 10; /* STA DAVANTI ALLA COPERTINA */
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px 0 115px; /* Padding sinistro enorme per non scrivere sopra la cover nascosta */
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        /* --- INFO BRANO E TESTI --- */
        .info-box {
            flex-grow: 1; min-width: 0; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; gap: 2px;
        }
        .scroll-container { width: 100%; overflow: hidden; white-space: nowrap; text-align: left; }
        .scroll-wrapper { display: inline-flex; align-items: center; white-space: nowrap; }
        .info-box h2 { font-size: 1.05rem; font-weight: 800; color: #000; line-height: 1.2; }
        .info-box p { font-size: 0.8rem; color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .text-item { white-space: nowrap; padding-right: 0; }
        .is-scrolling { animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

        /* --- UI BUFFERING E BADGE --- */
        #buffering-box { display: none; flex-direction: row; align-items: center; width: 100%; height: 15px; }
        .buf-label { font-size: 0.8rem; font-weight: 800; color: #ffa500; text-transform: uppercase; }
        .buf-bananas { font-size: 0.8rem; margin-left: 5px; white-space: nowrap; }

        .actions-box { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .status-badge { font-size: 0.65rem; padding: 4px 8px; border-radius: 4px; font-weight: 700; color: #fff; background: #555; }
        .play-btn {
            background: #000; color: #fff; width: 46px; height: 46px;
            border: none; border-radius: 50%; cursor: pointer; display: flex;
            justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.1s ease;
        }
        .play-btn:active { transform: scale(0.92); }
        .play-btn svg { width: 20px; height: 20px; fill: currentColor; }
        @keyframes spin-anim { 100% { transform: rotate(360deg); } }
        .spin { animation: spin-anim 1s linear infinite; }

        /* Adattamento Mobile */
        @media (max-width: 500px) {
            .player-wrapper { margin-left: 30px; width: 85%; }
            .cover-stage { left: -20px; width: 110px; height: 110px; }
            .player-bar { padding-left: 100px; }
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        
        <!-- PALCOSCENICO COPERTINE (Dietro la barra) -->
        <div class="cover-stage">
            <!-- Usiamo due immagini per poter fare lo swap animato -->
            <img id="cover-a" class="cover-art cover-visible" src="https://assets.nicepagecdn.com/966432fa/6080027/files/default-monkey.jpg" alt="Cover A">
            <img id="cover-b" class="cover-art cover-hidden" src="" alt="Cover B">
        </div>

        <!-- BARRA BIANCA (Davanti) -->
        <div class="player-bar">
            <div class="info-box">
                <div class="scroll-container"><div class="scroll-wrapper" id="title-wrapper">
                    <h2><span class="text-item" id="main-title">Monkey Radio Italy</span></h2>
                </div></div>
                
                <div class="scroll-container" id="track-container"><div class="scroll-wrapper" id="track-wrapper">
                    <p><span class="text-item" id="track-title">Diretta Streaming</span></p>
                </div></div>

                <div id="buffering-box">
                    <div class="buf-label">WAIT</div>
                    <div class="buf-bananas" id="bananas"></div>
                </div>
            </div>

            <div class="actions-box">
                <div class="status-badge" id="statusTag">STOP</div>
                <button class="play-btn" id="playBtn"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            </div>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous" preload="none"></audio>

    <script>
        // Configurazione
        const STREAM_URL = "https://a11.asurahosting.com:8610/radio.mp3";
        const STATUS_JSON_URL = "https://a11.asurahosting.com:8610/status-json.xsl";
        const DEFAULT_COVER = "https://monkeyradioitaly.nicepage.io/images/default.jpg"; // <-- INSERISCI QUI IL LINK A UN'IMMAGINE QUADRATA DELLA TUA SCIMMIA
        const PAUSE_THRESHOLD = 30000;

        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const statusTag = document.getElementById('statusTag');
        const trackContainer = document.getElementById('track-container');
        const trackWrapper = document.getElementById('track-wrapper');
        const bufferingBox = document.getElementById('buffering-box');
        const bananasEl = document.getElementById('bananas');
        
        // Elementi Copertina
        const coverA = document.getElementById('cover-a');
        const coverB = document.getElementById('cover-b');
        let activeCover = 'A'; // Traccia quale immagine è attualmente visibile

        const playSVG = '<path d="M8 5v14l11-7z"/>';
        const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        const spinnerSVG = '<path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>';

        let userIntentPlay = false; let reconnectTimer = null; let pauseTime = 0; let bananaInterval = null;
        let currentSongInfo = "Diretta Streaming"; let currentCoverUrl = null;

        // ANIMAZIONE COPERTINA (Effetto Molla)
        function swapCover(newUrl) {
            const incomingUrl = newUrl || DEFAULT_COVER;
            if (activeCover === 'A') {
                coverB.src = incomingUrl;
                coverA.classList.replace('cover-visible', 'cover-hidden'); // Scende la vecchia
                coverB.classList.replace('cover-hidden', 'cover-visible'); // Sale la nuova
                activeCover = 'B';
            } else {
                coverA.src = incomingUrl;
                coverB.classList.replace('cover-visible', 'cover-hidden');
                coverA.classList.replace('cover-hidden', 'cover-visible');
                activeCover = 'A';
            }
        }

        // MARQUEE TESTO
        function applyMarquee(originalText) {
            trackWrapper.classList.remove('is-scrolling'); trackWrapper.innerHTML = '';
            const item = document.createElement('span'); item.className = 'text-item'; 
            item.textContent = originalText; trackWrapper.appendChild(item);
            if (item.offsetWidth > trackContainer.offsetWidth) {
                item.textContent = originalText + '  🐵  '; item.style.paddingRight = "30px";
                trackWrapper.appendChild(item.cloneNode(true)); trackWrapper.classList.add('is-scrolling');
            }
        }
        window.addEventListener('resize', () => applyMarquee(currentSongInfo));

        // LETTURA DATI SERVER
        async function fetchSongData() {
            try {
                const res = await fetch(STATUS_JSON_URL + "?_=" + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                let rawInfo = "Diretta Streaming";
                if (data.icestats && data.icestats.source) {
                    const sources = Array.isArray(data.icestats.source) ? data.icestats.source : [data.icestats.source];
                    const mount = sources.find(m => m.listenurl && m.listenurl.includes("/radio.mp3"));
                    if (mount && mount.title) rawInfo = mount.title;
                }
                if (rawInfo !== currentSongInfo) {
                    currentSongInfo = rawInfo;
                    await processNewSong(rawInfo);
                }
            } catch (err) {}
        }

        // RICERCA ITUNES E TRIGGER ANIMAZIONE
        async function processNewSong(songName) {
            let coverUrl = null;
            if (songName !== "Diretta Streaming") {
                try {
                    const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(songName)}&entity=song&limit=1`);
                    const itunesData = await itunesRes.json();
                    if (itunesData.results && itunesData.results.length > 0) {
                        coverUrl = itunesData.results[0].artworkUrl100.replace('100x100bb', '512x512bb');
                    }
                } catch (e) {}
            }
            currentCoverUrl = coverUrl;
            swapCover(coverUrl); // Lancia il rimbalzo!
            applyMarquee(songName);
            if (userIntentPlay || !audio.paused) updateMediaSession();
        }

        setInterval(fetchSongData, 10000); fetchSongData();

        // UI BANANE & STATI
        function startBananas() {
            trackContainer.style.display = 'none'; bufferingBox.style.display = 'flex';
            clearInterval(bananaInterval); let bCount = 0;
            bananaInterval = setInterval(() => { bCount++; if (bCount > 5) bCount = 1; bananasEl.textContent = '🍌'.repeat(bCount); }, 400);
        }
        function stopBananas() { clearInterval(bananaInterval); bufferingBox.style.display = 'none'; trackContainer.style.display = 'block'; }
        function setStatus(text, color) { statusTag.innerText = text; statusTag.style.background = color; }
        function setUIState(state) {
            if (state === 'loading') { playIcon.innerHTML = spinnerSVG; playIcon.classList.add('spin'); setStatus("WAIT", "#ffa500"); startBananas(); } 
            else if (state === 'playing') { playIcon.innerHTML = pauseSVG; playIcon.classList.remove('spin'); setStatus("LIVE", "#e53e3e"); stopBananas(); } 
            else if (state === 'stopped') { playIcon.innerHTML = playSVG; playIcon.classList.remove('spin'); setStatus("STOP", "#555"); stopBananas(); }
        }

        // AUDIO CONTROLS
        function hardStop() { audio.pause(); audio.removeAttribute('src'); audio.load(); }
        playBtn.addEventListener('click', () => {
            let now = Date.now();
            if (!userIntentPlay) {
                userIntentPlay = true; setUIState('loading');
                if (!audio.src || (now - pauseTime > PAUSE_THRESHOLD)) { hardStop(); audio.src = `${STREAM_URL}?t=${now}`; }
                audio.play().then(() => updateMediaSession()).catch(() => { userIntentPlay = false; setUIState('stopped'); });
            } else {
                userIntentPlay = false; pauseTime = Date.now(); clearTimeout(reconnectTimer); audio.pause(); setUIState('stopped');
            }
        });

        // RECONNECT
        function forceReconnect() {
            if (!userIntentPlay) return; setUIState('loading'); hardStop(); audio.src = `${STREAM_URL}?t=${Date.now()}`;
            audio.play().catch(() => { reconnectTimer = setTimeout(forceReconnect, 3000); });
        }
        audio.addEventListener('error', () => { if (userIntentPlay) { clearTimeout(reconnectTimer); reconnectTimer = setTimeout(forceReconnect, 2000); } });
        audio.addEventListener('waiting', () => { if (userIntentPlay) setUIState('loading'); });
        audio.addEventListener('stalled', () => { if (userIntentPlay) { setUIState('loading'); clearTimeout(reconnectTimer); reconnectTimer = setTimeout(forceReconnect, 4000); } });
        audio.addEventListener('playing', () => { if (userIntentPlay) { clearTimeout(reconnectTimer); setUIState('playing'); } });
        audio.addEventListener('pause', () => { if (userIntentPlay && audio.readyState > 0) { userIntentPlay = false; pauseTime = Date.now(); clearTimeout(reconnectTimer); setUIState('stopped'); } });

        // BLUETOOTH MEDIA SESSION
        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                let title = currentSongInfo; let artist = "Monkey Radio Italy";
                if (currentSongInfo.includes(" - ")) { let parts = currentSongInfo.split(" - "); artist = parts[0].trim(); title = parts.slice(1).join(" - ").trim(); }
                let artworkArr = currentCoverUrl ? [{ src: currentCoverUrl, sizes: '512x512', type: 'image/jpeg' }] : [];
                navigator.mediaSession.metadata = new MediaMetadata({ title, artist, album: 'Monkey Radio', artwork: artworkArr });
            }
        }
    </script>
</body>
</html>
