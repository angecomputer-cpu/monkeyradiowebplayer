<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            overflow: hidden;
            user-select: none;
        }

        .player-bar {
            width: 100%;
            height: 100%;
            padding: 0 15px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #ffffff;
        }

        .logo-box {
            width: 80px;  
            height: 100%; 
            overflow: hidden;
            background: #000000;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .info-box {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2px;
        }

        .scroll-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-align: left;
        }
        .scroll-wrapper {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            will-change: transform;
            justify-content: flex-start;
        }

        .info-box h2 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.2;
        }
        .info-box p {
            font-size: 0.8rem;
            color: #555555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .text-item { white-space: nowrap; padding-right: 0; }
        .is-scrolling { animation: marquee 12s linear infinite; }
        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        #buffering-box {
            display: none;
            flex-direction: row;
            align-items: center;
            width: 100%;
        }
        .buf-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #e5a900;
            margin-right: 6px;
            letter-spacing: 0.5px;
        }
        .buf-bananas {
            font-size: 0.9rem;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            #buffering-box {
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
            }
            .buf-label { margin-bottom: 2px; margin-right: 0; }
        }

        .actions-box { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

        .play-btn {
            background: #000000; color: #ffffff; 
            width: 46px; height: 46px;
            border: none; border-radius: 50%;
            cursor: pointer; display: flex;
            justify-content: center; align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }
        .play-btn:active { transform: scale(0.92); }
        .play-btn svg { width: 20px; height: 20px; fill: currentColor; }

        @keyframes spin-anim { 100% { transform: rotate(360deg); } }
        .spin { animation: spin-anim 1s linear infinite; transform-origin: center; }

        .status-badge {
            font-size: 0.65rem; padding: 4px 8px; border-radius: 4px; font-weight: 700;
            letter-spacing: 0.5px; text-align: center; color: #ffffff; background: #555555;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="player-bar">
        <div class="logo-box">
            <video id="coverVideo" src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" preload="auto" loop muted playsinline></video>
            <img id="coverImg" alt="Cover Brano">
        </div>

        <div class="info-box">
            <div class="scroll-container" id="title-container">
                <div class="scroll-wrapper" id="title-wrapper">
                    <h2><span class="text-item" id="main-title">Monkey Radio Italy</span></h2>
                </div>
            </div>
            
            <div class="scroll-container" id="track-container">
                <div class="scroll-wrapper" id="track-wrapper">
                    <p><span class="text-item" id="track-title">Diretta Streaming</span></p>
                </div>
            </div>

            <div id="buffering-box">
                <div class="buf-label">BUFFERING</div>
                <div class="buf-bananas" id="bananas"></div>
            </div>
        </div>

        <div class="actions-box">
            <div class="status-badge" id="statusTag">STOP</div>
            <button class="play-btn" id="playBtn" aria-label="Riproduci">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous" preload="none"></audio>

    <script>
        // === CONFIGURAZIONE PRINCIPALE & TELEGRAM ===
        const STREAM_URL = "https://a11.asurahosting.com:8610/radio.mp3";
        const TELEGRAM_BOT_TOKEN = "INSERISCI_TELEGRAM_BOT_TOKEN";
        const TELEGRAM_ADMIN_ID = "INSERISCI_TELEGRAM_ADMIN_ID";
        const DEFAULT_VIDEO = "https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4";
        const PAUSE_THRESHOLD = 30000;

        // === ELEMENTI DOM ===
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const statusTag = document.getElementById('statusTag');
        const titleContainer = document.getElementById('title-container');
        const titleWrapper = document.getElementById('title-wrapper');
        const trackContainer = document.getElementById('track-container');
        const trackWrapper = document.getElementById('track-wrapper');
        const bufferingBox = document.getElementById('buffering-box');
        const bananasEl = document.getElementById('bananas');
        const coverVideo = document.getElementById('coverVideo');
        const coverImg = document.getElementById('coverImg');

        // === SVG ICONS ===
        const playSVG = '<path d="M8 5v14l11-7z"/>';
        const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        const spinnerSVG = '<path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>';

        // === VARIABILI DI STATO ===
        let wakeLock = null;
        let userIntentPlay = false;
        let reconnectTimer = null;
        let pauseTime = 0;
        let bananaInterval = null;
        
        let currentSongInfo = "Diretta Streaming";
        let currentCoverUrl = null;

        // =====================================
        // 1. GESTIONE MARQUEE (Testi Scorrevoli)
        // =====================================
        function applySmartMarquee(container, wrapper, idPrefix, originalText) {
            wrapper.classList.remove('is-scrolling');
            wrapper.innerHTML = '';
            
            const item = document.createElement('span');
            item.className = 'text-item';
            item.textContent = originalText;
            item.style.paddingRight = "0px";
            wrapper.appendChild(item);

            if (item.offsetWidth > container.offsetWidth) {
                item.textContent = originalText + '  🐵  ';
                item.style.paddingRight = "30px";
                const duplicateItem = item.cloneNode(true);
                wrapper.appendChild(duplicateItem);
                wrapper.classList.add('is-scrolling');
            }
        }

        function updateTexts(songText) {
            applySmartMarquee(titleContainer, titleWrapper, 'main-title', "Monkey Radio Italy");
            applySmartMarquee(trackContainer, trackWrapper, 'track-title', songText);
        }

        window.addEventListener('resize', () => updateTexts(currentSongInfo));

        // =====================================
        // 2. RECUPERO DATI BRANO (Tramite API Telegram sicure)
        // =====================================
        async function fetchSongData() {
            try {
                const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat?chat_id=${TELEGRAM_ADMIN_ID}`);
                if (!res.ok) return;
                
                const data = await res.json();
                let rawInfo = "Diretta Streaming";

                if (data.ok && data.result) {
                    rawInfo = data.result.description || data.result.title || "Diretta Streaming";
                }

                if (rawInfo !== currentSongInfo) {
                    currentSongInfo = rawInfo;
                    await processNewSong(rawInfo);
                }
            } catch (err) {
                console.error("Lettura metadati Telegram fallita:", err);
            }
        }

        async function processNewSong(songName) {
            let coverUrl = null;
            if (songName !== "Diretta Streaming") {
                try {
                    const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(songName)}&entity=song&limit=1`);
                    const itunesData = await itunesRes.json();
                    if (itunesData.results && itunesData.results.length > 0) {
                        coverUrl = itunesData.results[0].artworkUrl100.replace('100x100bb', '512x512bb');
                    }
                } catch (e) {}
            }

            if (coverUrl) {
                coverImg.src = coverUrl;
                coverImg.style.display = 'block';
                coverVideo.style.display = 'none';
                currentCoverUrl = coverUrl;
            } else {
                coverImg.style.display = 'none';
                coverVideo.style.display = 'block';
                currentCoverUrl = null;
            }

            updateTexts(songName);
            if (userIntentPlay || !audio.paused) {
                updateMediaSession();
            }
        }

        setInterval(fetchSongData, 12000);
        fetchSongData();

        // =====================================
        // 3. ANIMAZIONE BANANE & UI STATE
        // =====================================
        function startBananas() {
            bufferingBox.style.display = 'flex';
            trackContainer.style.display = 'none';
            clearInterval(bananaInterval);
            let bCount = 0;
            
            bananaInterval = setInterval(() => {
                bCount++;
                const isMobile = window.innerWidth <= 480;
                const maxBananas = isMobile ? 3 : 6;
                if (bCount > maxBananas) bCount = 1;
                bananasEl.textContent = '🍌'.repeat(bCount);
            }, 400);
        }

        function stopBananas() {
            clearInterval(bananaInterval);
            bufferingBox.style.display = 'none';
            trackContainer.style.display = 'block';
        }

        function setUIState(state) {
            if (state === 'loading') {
                playIcon.innerHTML = spinnerSVG;
                playIcon.classList.add('spin');
                setStatus("WAIT", "#ffa500");
                startBananas();
            } else if (state === 'playing') {
                playIcon.innerHTML = pauseSVG;
                playIcon.classList.remove('spin');
                setStatus("LIVE", "#e53e3e");
                stopBananas();
            } else if (state === 'stopped') {
                playIcon.innerHTML = playSVG;
                playIcon.classList.remove('spin');
                setStatus("STOP", "#555555");
                stopBananas();
            }
        }

        function setStatus(text, color) {
            statusTag.innerText = text;
            statusTag.style.background = color;
        }

        // =====================================
        // 4. GESTIONE FLUSSO AUDIO & PAUSA
        // =====================================
        function hardStop() {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
        }

        function togglePlay() {
            let now = Date.now();

            if (!userIntentPlay) {
                userIntentPlay = true;
                setUIState('loading');
                
                if (!audio.src || (now - pauseTime > PAUSE_THRESHOLD)) {
                    hardStop();
                    audio.src = `${STREAM_URL}?t=${now}`;
                }
                
                audio.play().then(() => {
                    requestWakeLock();
                    updateMediaSession();
                }).catch(err => {
                    userIntentPlay = false;
                    setUIState('stopped');
                });
            } else {
                userIntentPlay = false;
                pauseTime = Date.now();
                clearTimeout(reconnectTimer);
                audio.pause();
                setUIState('stopped');
                releaseWakeLock();
            }
        }
        playBtn.addEventListener('click', togglePlay);

        // =====================================
        // 5. STABILITA' RETE E AUTO-RECONNECT
        // =====================================
        function forceReconnect() {
            if (!userIntentPlay) return;
            setUIState('loading');
            hardStop();
            audio.src = `${STREAM_URL}?t=${Date.now()}`;
            audio.play().catch(() => { reconnectTimer = setTimeout(forceReconnect, 3000); });
        }

        audio.addEventListener('error', () => {
            if (userIntentPlay) { clearTimeout(reconnectTimer); reconnectTimer = setTimeout(forceReconnect, 2000); }
        });
        audio.addEventListener('waiting', () => { if (userIntentPlay) setUIState('loading'); });
        audio.addEventListener('stalled', () => {
            if (userIntentPlay) {
                setUIState('loading');
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(forceReconnect, 4000);
            }
        });
        audio.addEventListener('playing', () => {
            if (userIntentPlay) { clearTimeout(reconnectTimer); setUIState('playing'); }
        });

        audio.addEventListener('pause', () => {
            if (userIntentPlay && audio.readyState > 0) {
                userIntentPlay = false;
                pauseTime = Date.now();
                clearTimeout(reconnectTimer);
                setUIState('stopped');
            }
        });

        // =====================================
        // 6. BLUETOOTH & WAKE LOCK
        // =====================================
        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                let title = currentSongInfo;
                let artist = "Monkey Radio Italy";

                if (currentSongInfo.includes(" - ")) {
                    let parts = currentSongInfo.split(" - ");
                    artist = parts[0].trim();
                    title = parts.slice(1).join(" - ").trim();
                } else if (currentSongInfo !== "Diretta Streaming") {
                    artist = "In Diretta";
                }

                let artworkArr = currentCoverUrl 
                    ? [ { src: currentCoverUrl, sizes: '512x512', type: 'image/jpeg' } ]
                    : [ { src: DEFAULT_VIDEO, sizes: '512x512', type: 'video/mp4' } ];

                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: artist,
                    album: 'Monkey Radio',
                    artwork: artworkArr
                });

                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && !audio.paused) {
                await requestWakeLock();
            }
        });

        window.addEventListener('DOMContentLoaded', () => updateTexts("Diretta Streaming"));
    </script>
</body>
</html>
